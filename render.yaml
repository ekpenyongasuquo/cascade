services:
  - type: web
    name: cascade
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn webhook.receiver:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: DATAHUB_SERVER
        value: http://127.0.0.1:8979
      - key: GITHUB_WEBHOOK_SECRET
        value: cascade_secret_2026